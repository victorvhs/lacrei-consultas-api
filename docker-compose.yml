services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate --settings=config.settings.local &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --reload"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lacrei
      POSTGRES_PASSWORD: lacrei
      POSTGRES_DB: lacrei
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacrei"]
      interval: 5s
      timeout: 5s
      retries: 5

  asaas_simulator:
    build:
      context: ./asaas_simulator
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    profiles:
      - payments

volumes:
  postgres_data:
