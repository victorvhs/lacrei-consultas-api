name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, hml]
  pull_request:
    branches: [main, dev, hml]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3

      - name: Install dependencies
        run: poetry install --no-root

      - name: Ruff check
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Import linter
        run: poetry run lint-imports
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lacrei
          POSTGRES_PASSWORD: lacrei
          POSTGRES_DB: lacrei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3

      - name: Install dependencies
        run: poetry install --no-root

      - name: Check migrations
        env:
          DATABASE_URL: postgres://lacrei:lacrei@localhost:5432/lacrei_test
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: poetry run python manage.py makemigrations --check

      - name: Django check deploy
        env:
          DATABASE_URL: postgres://lacrei:lacrei@localhost:5432/lacrei_test
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: poetry run python manage.py check --deploy 2>&1 || true

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgres://lacrei:lacrei@localhost:5432/lacrei_test
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          poetry run coverage run manage.py test --verbosity=2
          poetry run coverage report --fail-under=85

      - name: pip-audit
        run: poetry run pip-audit
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: lacrei-saude:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lacrei-saude:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

  deploy-ephemeral:
    name: Deploy Ephemeral
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build release compose
        run: |
          docker compose -f docker-compose.release.yml build api
          docker compose -f docker-compose.release.yml up -d db
          sleep 10
          docker compose -f docker-compose.release.yml run migrate
          docker compose -f docker-compose.release.yml up -d api
          sleep 5

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8001/health/live; then
              echo "Health check passed"
              break
            fi
            sleep 2
          done

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.release.yml down -v

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: deploy-ephemeral
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-aws-staging:
    name: Deploy AWS Staging
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Deploy to staging
        run: echo "Deploy to staging would run here"

  deploy-aws-production:
    name: Deploy AWS Production
    runs-on: ubuntu-latest
    needs: deploy-aws-staging
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Deploy to production
        run: echo "Deploy to production would run here"
