services:
  api:
    image: ${APP_IMAGE:-lacrei-saude:latest}
    ports:
      - "8001:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-release-secret-key}
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=postgres://lacrei:lacrei@db:5432/lacrei
      - ENVIRONMENT=staging
      - LOG_LEVEL=INFO
      - GUNICORN_WORKERS=2
      - GUNICORN_THREADS=2
      - PAYMENT_GATEWAY=fake
      - ASAAS_BASE_URL=http://asaas_simulator:8080
      - ASAAS_WEBHOOK_TOKENS=token123
      - REPASSE_PERCENTUAL_PADRAO=80
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lacrei
      POSTGRES_PASSWORD: lacrei
      POSTGRES_DB: lacrei
    volumes:
      - release_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacrei"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ${APP_IMAGE:-lacrei-saude:latest}
    command: python manage.py migrate --settings=config.settings.production
    environment:
      - SECRET_KEY=${SECRET_KEY:-release-secret-key}
      - DATABASE_URL=postgres://lacrei:lacrei@db:5432/lacrei
      - ENVIRONMENT=staging
    depends_on:
      db:
        condition: service_healthy

  asaas_simulator:
    build:
      context: ./asaas_simulator
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

volumes:
  release_data:
